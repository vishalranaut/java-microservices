services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    ports: ["5672:5672", "15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 10

  user-service:
    build: { context: ., args: { MODULE: user-service } }
    restart: on-failure
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/users_db
      DB_USER: app
      DB_PASSWORD: app
      REDIS_HOST: redis
    ports: ["8081:8081", "9090:9090"]

  order-service:
    build: { context: ., args: { MODULE: order-service } }
    restart: on-failure
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      user-service: { condition: service_started }
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/orders_db
      DB_USER: app
      DB_PASSWORD: app
      RABBIT_HOST: rabbitmq
      USER_SERVICE_GRPC: user-service:9090
    ports: ["8082:8082"]

  notification-service:
    build: { context: ., args: { MODULE: notification-service } }
    restart: on-failure
    depends_on:
      rabbitmq: { condition: service_healthy }
    environment:
      RABBIT_HOST: rabbitmq
    ports: ["8083:8083"]

  api-gateway:
    build: { context: ., args: { MODULE: api-gateway } }
    restart: on-failure
    depends_on:
      redis: { condition: service_healthy }
      user-service: { condition: service_started }
      order-service: { condition: service_started }
    environment:
      REDIS_HOST: redis
      USER_SERVICE_URL: http://user-service:8081
      ORDER_SERVICE_URL: http://order-service:8082
    ports: ["8080:8080"]

volumes:
  pgdata:
