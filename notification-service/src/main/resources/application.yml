server:
  port: 8083

spring:
  application:
    name: notification-service
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        default-requeue-rejected: false   # failed messages go to the dead-letter queue
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
